[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ottomandevice"
version = "0.1.0"
description = "Edge device runtime for camera, audio, AI, and cloud communication"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "OttomanDevice Team" }]
dependencies = [
    "supabase>=2.0.0",
    "python-dotenv>=1.0.0",
    "opencv-python>=4.8.0",
    "psutil>=5.9.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0.0",
    "websockets>=12.0",
    "PyJWT>=2.8.0",
]

[project.scripts]
ottomandevice = "ottomandevice.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ottomandevice = ["config/default.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ottomandevice"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*", "psutil", "psutil.*", "cv2", "cv2.*", "numpy", "numpy.*", "jwt", "jwt.*"]
ignore_missing_imports = true